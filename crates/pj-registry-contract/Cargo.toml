[package]
name = "pj-registry-contract"
description = "Freenet contract holding the public directory of freenet-pj boards"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pj-core.workspace = true
freenet-stdlib.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true

[features]
default = ["contract", "freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]

[lints]
workspace = true
