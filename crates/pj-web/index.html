<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>freenet-pj</title>
    <!-- Resolve the theme before the first paint. The stylesheet keys off an
         explicit data-theme rather than a media query, so that the in-app switch
         can override the operating system; without this line a light-mode desktop
         would flash the dark palette until wasm finishes booting. -->
    <script>
      document.documentElement.dataset.theme = window.matchMedia(
        "(prefers-color-scheme: light)",
      ).matches
        ? "light"
        : "dark";
    </script>
    <!-- Relative so the app works under the node's /v1/contract/web/<id>/ path. -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Classic script, not a module: it must define the shell bridge before the
         wasm module starts and reaches for it. -->
    <script src="bridge.js"></script>
  </head>
  <body>
    <noscript>freenet-pj is a WebAssembly application and needs JavaScript enabled.</noscript>
    <script type="module">
      import init from "./pj_web.js";
      init().catch((err) => {
        document.body.innerHTML =
          '<pre class="boot-error">freenet-pj failed to start:\n' + err + "</pre>";
      });
    </script>
  </body>
</html>
